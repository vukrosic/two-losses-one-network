<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5f9e"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c4671d"/></marker>
    <pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M6,0 L0,0 L0,6" fill="none" stroke="#d3d7dd" stroke-width="0.6"/></pattern>
  </defs>
  <rect width="880" height="280" fill="#fff"/>
  <!-- (a) driving -->
  <rect x="12" y="12" width="205" height="256" rx="12" fill="#f6f7f9" stroke="#e1e4e8"/>
  <text x="26" y="38" font-size="15" font-weight="bold" fill="#1b1b1b">(a) Driving</text>
  <rect x="24" y="76" width="181" height="70" fill="#d9dce1"/>
  <line x1="24" y1="111" x2="205" y2="111" stroke="#fff" stroke-width="2" stroke-dasharray="10 8"/>
  <g fill="#f4f5f7"><rect x="140" y="79" width="22" height="5"/><rect x="140" y="90" width="22" height="5"/><rect x="140" y="101" width="22" height="5"/><rect x="140" y="116" width="22" height="5"/><rect x="140" y="127" width="22" height="5"/><rect x="140" y="138" width="22" height="5"/></g>
  <rect x="34" y="119" width="36" height="19" rx="5" fill="#4a78b5"/>
  <line x1="74" y1="128" x2="196" y2="128" stroke="#2f5f9e" stroke-width="2.4" marker-end="url(#ab)"/>
  <circle cx="151" cy="62" r="7" fill="#e8892f"/>
  <line x1="151" y1="70" x2="151" y2="88" stroke="#c4671d" stroke-width="2.4" marker-end="url(#ao)"/>
  <text x="26" y="172" font-size="12.5" fill="#1b1b1b">A car brakes for a pedestrian</text>
  <text x="26" y="188" font-size="12.5" fill="#1b1b1b">at a crossing. The car moves</text>
  <text x="26" y="204" font-size="12.5" fill="#1b1b1b">5.2× farther per step.</text>
  <text x="26" y="236" font-size="12" fill="#2f5f9e">bigger loss: car</text>
  <text x="26" y="254" font-size="12" fill="#c4671d">smaller loss: pedestrian</text>
  <!-- (b) robot arm -->
  <rect x="229" y="12" width="205" height="256" rx="12" fill="#f6f7f9" stroke="#e1e4e8"/>
  <text x="243" y="38" font-size="15" font-weight="bold" fill="#1b1b1b">(b) Robot arm</text>
  <line x1="245" y1="146" x2="420" y2="146" stroke="#8a94a3" stroke-width="3"/>
  <rect x="282" y="124" width="58" height="22" rx="4" fill="#e8892f"/>
  <line x1="290" y1="156" x2="318" y2="156" stroke="#c4671d" stroke-width="2.4" marker-end="url(#ao)"/>
  <line x1="311" y1="124" x2="352" y2="88" stroke="#5a6472" stroke-width="5" stroke-linecap="round"/>
  <line x1="352" y1="88" x2="396" y2="76" stroke="#5a6472" stroke-width="5" stroke-linecap="round"/>
  <circle cx="352" cy="88" r="4" fill="#fff" stroke="#5a6472" stroke-width="2"/>
  <circle cx="398" cy="75" r="7" fill="#4a78b5"/>
  <path d="M 404 98 A 46 46 0 0 0 392 52" fill="none" stroke="#2f5f9e" stroke-width="2.4" marker-end="url(#ab)"/>
  <text x="243" y="172" font-size="12.5" fill="#1b1b1b">One robot: a heavy base</text>
  <text x="243" y="188" font-size="12.5" fill="#1b1b1b">slides slowly while its arm</text>
  <text x="243" y="204" font-size="12.5" fill="#1b1b1b">swings fast.</text>
  <text x="243" y="236" font-size="12" fill="#2f5f9e">bigger loss: arm tip</text>
  <text x="243" y="254" font-size="12" fill="#c4671d">smaller loss: base</text>
  <!-- (c) two dots -->
  <rect x="446" y="12" width="205" height="256" rx="12" fill="#f6f7f9" stroke="#e1e4e8"/>
  <text x="460" y="38" font-size="15" font-weight="bold" fill="#1b1b1b">(c) Two dots</text>
  <rect x="500" y="54" width="96" height="96" fill="#fff"/>
  <rect x="500" y="54" width="96" height="96" fill="url(#grid)" stroke="#8a94a3"/>
  <rect x="560" y="72" width="12" height="12" fill="#4a78b5"/>
  <rect x="512" y="126" width="12" height="12" fill="#e8892f"/>
  <line x1="527" y1="123" x2="554" y2="91" stroke="#c4671d" stroke-width="2.2" marker-end="url(#ao)"/>
  <text x="460" y="172" font-size="12.5" fill="#1b1b1b">A 16×16 picture: a robot we</text>
  <text x="460" y="188" font-size="12.5" fill="#1b1b1b">steer and a stranger that</text>
  <text x="460" y="204" font-size="12.5" fill="#1b1b1b">chases, flees or circles it.</text>
  <text x="460" y="236" font-size="12" fill="#2f5f9e">bigger loss: robot (scaled)</text>
  <text x="460" y="254" font-size="12" fill="#c4671d">smaller loss: stranger</text>
  <!-- (d) teacher -->
  <rect x="663" y="12" width="205" height="256" rx="12" fill="#f6f7f9" stroke="#e1e4e8"/>
  <text x="677" y="38" font-size="15" font-weight="bold" fill="#1b1b1b">(d) Teacher networks</text>
  <rect x="677" y="74" width="62" height="70" rx="7" fill="#eceff3" stroke="#8a94a3"/>
  <text x="708" y="104" font-size="11.5" text-anchor="middle" fill="#1b1b1b">16 random</text>
  <text x="708" y="119" font-size="11.5" text-anchor="middle" fill="#1b1b1b">numbers</text>
  <line x1="739" y1="96" x2="760" y2="84" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="739" y1="122" x2="760" y2="134" stroke="#333" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="762" y="66" width="92" height="30" rx="6" fill="#dbe7f7" stroke="#4a78b5"/>
  <text x="808" y="85" font-size="11.5" text-anchor="middle" fill="#1b1b1b">teacher A, × a</text>
  <rect x="762" y="122" width="92" height="30" rx="6" fill="#fde3c8" stroke="#d9822b"/>
  <text x="808" y="141" font-size="11.5" text-anchor="middle" fill="#1b1b1b">teacher B</text>
  <text x="677" y="172" font-size="12.5" fill="#1b1b1b">Targets are outputs of two</text>
  <text x="677" y="188" font-size="12.5" fill="#1b1b1b">fixed random networks. No</text>
  <text x="677" y="204" font-size="12.5" fill="#1b1b1b">physics and no motion.</text>
  <text x="677" y="236" font-size="12" fill="#2f5f9e">bigger loss: target A</text>
  <text x="677" y="254" font-size="12" fill="#c4671d">smaller loss: target B</text>
</svg>
