<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" font-family="Helvetica, Arial, sans-serif">
  <rect width="880" height="250" fill="#fff"/>
  <text x="14" y="24" font-size="15" font-weight="bold" fill="#1b1b1b">Where the same sum appears (not tested here; what the rule predicts)</text>
  <!-- card template: x, width 205 -->
  <g>
    <rect x="12" y="40" width="205" height="198" rx="12" fill="#f6f7f9" stroke="#e1e4e8"/>
    <text x="26" y="66" font-size="14" font-weight="bold" fill="#1b1b1b">Self-driving world model</text>
    <text x="26" y="94" font-size="12" fill="#5a5a5a">bigger term</text>
    <rect x="26" y="100" width="160" height="16" rx="3" fill="#4a78b5"/>
    <text x="30" y="112" font-size="11.5" fill="#fff">cars, trucks</text>
    <text x="26" y="138" font-size="12" fill="#5a5a5a">smaller term</text>
    <rect x="26" y="144" width="30" height="16" rx="3" fill="#e8892f"/>
    <text x="62" y="156" font-size="11.5" fill="#1b1b1b">pedestrians, cyclists</text>
    <text x="26" y="190" font-size="12" fill="#1b1b1b">Pedestrians predicted worse</text>
    <text x="26" y="206" font-size="12" fill="#1b1b1b">than by a per-type model of</text>
    <text x="26" y="222" font-size="12" fill="#1b1b1b">equal size.</text>
  </g>
  <g>
    <rect x="229" y="40" width="205" height="198" rx="12" fill="#f6f7f9" stroke="#e1e4e8"/>
    <text x="243" y="66" font-size="14" font-weight="bold" fill="#1b1b1b">Robot policy</text>
    <text x="243" y="94" font-size="12" fill="#5a5a5a">bigger term</text>
    <rect x="243" y="100" width="160" height="16" rx="3" fill="#4a78b5"/>
    <text x="247" y="112" font-size="11.5" fill="#fff">large joints, base</text>
    <text x="243" y="138" font-size="12" fill="#5a5a5a">smaller term</text>
    <rect x="243" y="144" width="30" height="16" rx="3" fill="#e8892f"/>
    <text x="279" y="156" font-size="11.5" fill="#1b1b1b">gripper, fingers</text>
    <text x="243" y="190" font-size="12" fill="#1b1b1b">Small-range outputs learned</text>
    <text x="243" y="206" font-size="12" fill="#1b1b1b">worse unless each action</text>
    <text x="243" y="222" font-size="12" fill="#1b1b1b">dimension is rescaled.</text>
  </g>
  <g>
    <rect x="446" y="40" width="205" height="198" rx="12" fill="#f6f7f9" stroke="#e1e4e8"/>
    <text x="460" y="66" font-size="14" font-weight="bold" fill="#1b1b1b">Mixture-of-experts LM</text>
    <text x="460" y="94" font-size="12" fill="#5a5a5a">bigger term</text>
    <rect x="460" y="100" width="160" height="16" rx="3" fill="#4a78b5"/>
    <text x="464" y="112" font-size="11.5" fill="#fff">next-token loss</text>
    <text x="460" y="138" font-size="12" fill="#5a5a5a">smaller term</text>
    <rect x="460" y="144" width="10" height="16" rx="3" fill="#e8892f"/>
    <text x="476" y="156" font-size="11.5" fill="#1b1b1b">router balance loss × 0.01</text>
    <text x="460" y="190" font-size="12" fill="#1b1b1b">Expert balance learned worse</text>
    <text x="460" y="206" font-size="12" fill="#1b1b1b">by an amount set by the ratio</text>
    <text x="460" y="222" font-size="12" fill="#1b1b1b">of the two terms.</text>
  </g>
  <g>
    <rect x="663" y="40" width="205" height="198" rx="12" fill="#f6f7f9" stroke="#e1e4e8"/>
    <text x="677" y="66" font-size="14" font-weight="bold" fill="#1b1b1b">Multi-token prediction</text>
    <text x="677" y="94" font-size="12" fill="#5a5a5a">bigger term</text>
    <rect x="677" y="100" width="160" height="16" rx="3" fill="#4a78b5"/>
    <text x="681" y="112" font-size="11.5" fill="#fff">next-token loss</text>
    <text x="677" y="138" font-size="12" fill="#5a5a5a">smaller term</text>
    <rect x="677" y="144" width="22" height="16" rx="3" fill="#e8892f"/>
    <text x="705" y="156" font-size="11.5" fill="#1b1b1b">extra tokens × 0.1–0.3</text>
    <text x="677" y="190" font-size="12" fill="#1b1b1b">Extra-token head learned</text>
    <text x="677" y="206" font-size="12" fill="#1b1b1b">worse than by its own head</text>
    <text x="677" y="222" font-size="12" fill="#1b1b1b">of equal size.</text>
  </g>
</svg>
