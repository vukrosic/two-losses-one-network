<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" font-family="Helvetica, Arial, sans-serif">
  <rect width="880" height="270" fill="#fff"/>
  <rect x="12" y="12" width="856" height="246" rx="12" fill="#f6f7f9" stroke="#e1e4e8"/>
  <text x="30" y="40" font-size="15" font-weight="bold" fill="#1b1b1b">The same network and the same misses, measured in different units</text>
  <!-- headers -->
  <text x="30" y="70" font-size="12" fill="#5a5a5a">pedestrian measured in</text>
  <text x="210" y="70" font-size="12" fill="#5a5a5a">squared error: car + pedestrian</text>
  <text x="470" y="70" font-size="12" fill="#5a5a5a">share of the loss (car blue, pedestrian orange)</text>
  <!-- row 1 -->
  <text x="30" y="104" font-size="15" font-weight="bold" fill="#1b1b1b">metres</text>
  <text x="30" y="122" font-size="12" fill="#5a5a5a">misses by 0.1 m</text>
  <text x="210" y="112" font-size="14" fill="#1b1b1b">0.5² + 0.1² = 0.25 + <tspan font-weight="bold">0.01</tspan></text>
  <rect x="470" y="94" width="358" height="26" rx="4" fill="#4a78b5"/>
  <rect x="830" y="94" width="15" height="26" rx="3" fill="#e8892f"/>
  <text x="480" y="112" font-size="13" font-weight="bold" fill="#fff">car 96%</text>
  <text x="826" y="136" font-size="12" text-anchor="end" fill="#5a5a5a">pedestrian 4%</text>
  <!-- row 2 -->
  <text x="30" y="174" font-size="15" font-weight="bold" fill="#1b1b1b">centimetres</text>
  <text x="30" y="192" font-size="12" fill="#5a5a5a">misses by 10 cm</text>
  <text x="210" y="182" font-size="14" fill="#1b1b1b">0.5² + 10² = 0.25 + <tspan font-weight="bold">100</tspan></text>
  <rect x="470" y="164" width="3" height="26" rx="1" fill="#4a78b5"/>
  <rect x="475" y="164" width="370" height="26" rx="4" fill="#e8892f"/>
  <text x="835" y="182" font-size="13" font-weight="bold" text-anchor="end" fill="#fff">pedestrian 99.8%</text>
  <text x="470" y="206" font-size="12" fill="#5a5a5a">car 0.2%</text>
  <!-- footer -->
  <line x1="30" y1="222" x2="850" y2="222" stroke="#dde1e6"/>
  <text x="30" y="245" font-size="13.5" fill="#1b1b1b">Units 100× smaller make the squared error 100² = <tspan font-weight="bold">10,000× bigger</tspan>: exactly a loss weight of 10,000 on the pedestrian.</text>
</svg>
