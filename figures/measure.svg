<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fff"/>
  <!-- panel a -->
  <rect x="12" y="12" width="420" height="276" rx="12" fill="#f6f7f9" stroke="#e1e4e8"/>
  <text x="30" y="40" font-size="15" font-weight="bold" fill="#1b1b1b">(a) Λ: train one network per thing</text>
  <rect x="30" y="64" width="100" height="120" rx="8" fill="#eceff3" stroke="#8a94a3"/>
  <text x="80" y="112" font-size="13" text-anchor="middle" fill="#1b1b1b">car and</text>
  <text x="80" y="128" font-size="13" text-anchor="middle" fill="#1b1b1b">pedestrian,</text>
  <text x="80" y="144" font-size="13" text-anchor="middle" fill="#1b1b1b">last 3 steps</text>
  <line x1="130" y1="100" x2="160" y2="86" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="130" y1="148" x2="160" y2="162" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="162" y="64" width="112" height="40" rx="7" fill="#fde3c8" stroke="#d9822b"/>
  <text x="218" y="89" font-size="13" text-anchor="middle" fill="#1b1b1b">car's network</text>
  <rect x="162" y="144" width="112" height="40" rx="7" fill="#fde3c8" stroke="#d9822b"/>
  <text x="218" y="161" font-size="13" text-anchor="middle" fill="#1b1b1b">pedestrian's</text>
  <text x="218" y="176" font-size="13" text-anchor="middle" fill="#1b1b1b">network</text>
  <line x1="274" y1="84" x2="300" y2="84" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="274" y1="164" x2="300" y2="164" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="302" y="64" width="114" height="40" rx="7" fill="#d8efdf" stroke="#3f8f5a"/>
  <text x="359" y="81" font-size="12" text-anchor="middle" fill="#1b1b1b">car loss</text>
  <text x="359" y="97" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">0.50</text>
  <rect x="302" y="144" width="114" height="40" rx="7" fill="#d8efdf" stroke="#3f8f5a"/>
  <text x="359" y="161" font-size="12" text-anchor="middle" fill="#1b1b1b">pedestrian loss</text>
  <text x="359" y="177" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">0.05</text>
  <rect x="30" y="208" width="386" height="62" rx="8" fill="#fff" stroke="#c9ced6"/>
  <text x="223" y="233" font-size="14" text-anchor="middle" fill="#1b1b1b"><tspan font-weight="bold">Λ</tspan> = bigger loss ÷ smaller loss</text>
  <text x="223" y="256" font-size="14" text-anchor="middle" fill="#1b1b1b">= 0.50 ÷ 0.05 = <tspan font-weight="bold">10</tspan></text>
  <!-- panel b -->
  <rect x="448" y="12" width="420" height="276" rx="12" fill="#f6f7f9" stroke="#e1e4e8"/>
  <text x="466" y="40" font-size="15" font-weight="bold" fill="#1b1b1b">(b) P: one shared network, same weights</text>
  <rect x="466" y="64" width="100" height="120" rx="8" fill="#eceff3" stroke="#8a94a3"/>
  <text x="516" y="112" font-size="13" text-anchor="middle" fill="#1b1b1b">car and</text>
  <text x="516" y="128" font-size="13" text-anchor="middle" fill="#1b1b1b">pedestrian,</text>
  <text x="516" y="144" font-size="13" text-anchor="middle" fill="#1b1b1b">last 3 steps</text>
  <line x1="566" y1="124" x2="596" y2="124" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="598" y="84" width="112" height="80" rx="8" fill="#dbe7f7" stroke="#4a78b5"/>
  <text x="654" y="120" font-size="13" text-anchor="middle" fill="#1b1b1b">shared</text>
  <text x="654" y="136" font-size="13" text-anchor="middle" fill="#1b1b1b">network</text>
  <line x1="710" y1="104" x2="736" y2="86" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="710" y1="144" x2="736" y2="162" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="738" y="64" width="114" height="40" rx="7" fill="#d8efdf" stroke="#3f8f5a"/>
  <text x="795" y="81" font-size="12" text-anchor="middle" fill="#1b1b1b">car loss</text>
  <text x="795" y="97" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b1b1b">≈ 0.50</text>
  <rect x="738" y="144" width="114" height="40" rx="7" fill="#f9d6d1" stroke="#c0392b"/>
  <text x="795" y="161" font-size="12" text-anchor="middle" fill="#1b1b1b">pedestrian loss</text>
  <text x="795" y="177" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">0.092</text>
  <rect x="466" y="208" width="386" height="62" rx="8" fill="#fff" stroke="#c9ced6"/>
  <text x="659" y="233" font-size="14" text-anchor="middle" fill="#1b1b1b"><tspan font-weight="bold">P</tspan> = shared ÷ own = 0.092 ÷ 0.05 = <tspan font-weight="bold" fill="#c0392b">1.84</tspan></text>
  <text x="659" y="256" font-size="13" text-anchor="middle" fill="#5a5a5a">law: P = 1 + 0.15 × 10^0.75 = 1.84</text>
</svg>
